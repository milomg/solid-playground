<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solid Playground (embed)</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #ddd; font-family: -apple-system, system-ui, sans-serif; }
      #root { display: flex; height: 100vh; width: 100vw; }
      #editor { flex: 1; min-width: 0; }
      #preview-host { flex: 1; min-width: 0; border-left: 1px solid #333; }
      #preview-host iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
      .monaco-shell { flex: 1; min-width: 0; }
    </style>
  </head>
  <body>
    <script>
      // Minimal Node-like process shim. The bundled typescript-language-features
      // extension dereferences `process.versions.node`; without this we crash on activate.
      globalThis.process = globalThis.process ?? {};
      globalThis.process.env = globalThis.process.env ?? {};
      globalThis.process.versions = globalThis.process.versions ?? { node: '22.0.0' };
    </script>
    <div id="root">
      <div class="monaco-shell"><div id="editor"></div></div>
      <div id="preview-host"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
