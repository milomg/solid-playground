<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solid Playground</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
      #app { height: 100vh; width: 100vw; }
    </style>
  </head>
  <body>
    <script>
      // Minimal `process` shim — the bundled typescript-language-features extension dereferences
      // `process.versions.node` on activate. Leaving `node` UNSET is intentional: the same
      // extension's `--enableProjectWideIntelliSenseOnWeb` gate checks `!process.versions.node`
      // to decide whether to use vscode.workspace.fs (the path that sees our virtual node_modules)
      // or a network-XHR fallback that doesn't.
      globalThis.process = globalThis.process ?? {};
      globalThis.process.env = globalThis.process.env ?? {};
      globalThis.process.versions = globalThis.process.versions ?? {};
    </script>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
